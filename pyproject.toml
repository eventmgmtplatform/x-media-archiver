[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "x-media-archiver"
version = "0.2.0.dev0"
description = "Local-first CLI for cataloging and archiving public X media"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{ name = "eventmgmtplatform" }]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "gallery-dl>=1.30,<2",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.urls]
Repository = "https://github.com/eventmgmtplatform/x-media-archiver"
Issues = "https://github.com/eventmgmtplatform/x-media-archiver/issues"
Changelog = "https://github.com/eventmgmtplatform/x-media-archiver/blob/main/CHANGELOG.md"

[project.scripts]
xma = "xma.cli:app"

[dependency-groups]
dev = [
  "cyclonedx-bom>=7,<8",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pip-licenses>=5,<6",
  "pre-commit>=4.1,<5",
  "pyinstaller>=6.16,<7",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xma"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/handoffs/**"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=xma --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["xma"]
omit = ["src/xma/__main__.py"]
