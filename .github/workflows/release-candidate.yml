name: Release candidate

on:
  push:
    branches: ["release/v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.head_ref || github.ref_name, 'release/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: ./scripts/build-release-candidate.sh release-artifacts
      - run: ./scripts/validate-release-candidate.sh release-artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: xma-v0.1.1-linux-x86_64
          path: release-artifacts/
          if-no-files-found: error

  portability:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: xma-v0.1.1-linux-x86_64
          path: release-artifacts
      - run: |
          (cd release-artifacts && sha256sum -c SHA256SUMS)
          test_dir=$(mktemp -d)
          tar -C "$test_dir" -xzf release-artifacts/xma-v0.1.1-linux-x86_64.tar.gz
          env -i PATH=/usr/bin:/bin HOME="$test_dir" "$test_dir/xma-v0.1.1-linux-x86_64/xma" --help
          env -i PATH=/usr/bin:/bin HOME="$test_dir" "$test_dir/xma-v0.1.1-linux-x86_64/xma" version --short | grep -Fx 0.1.1
