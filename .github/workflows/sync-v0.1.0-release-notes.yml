name: Sync v0.1.0 release notes

on:
  push:
    branches: [main]
    paths:
      - docs/release/XMA-CLI-001_RELEASE-NOTES_v0.1.0.md
      - .github/workflows/sync-v0.1.0-release-notes.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.0
      RELEASE_COMMIT: c997cce488b4486ffd8dc079cd25819bec402b77
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify immutable tag
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$RELEASE_COMMIT"
      - name: Reconcile public release notes
        run: |
          gh release edit "$RELEASE_TAG" \
            --title "XMA $RELEASE_TAG" \
            --notes-file docs/release/XMA-CLI-001_RELEASE-NOTES_v0.1.0.md
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" = false
