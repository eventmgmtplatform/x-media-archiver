name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --locked --all-groups
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Build
        run: uv build
      - name: Verify release metadata
        run: uv run python scripts/verify-release-metadata.py
      - name: Inspect distributions
        run: |
          unzip -l dist/x_media_archiver-0.1.1-py3-none-any.whl
          tar -tzf dist/x_media_archiver-0.1.1.tar.gz
          ! unzip -l dist/*.whl | grep -Ei 'cookies|\.sqlite|\.mp4|\.env'
      - name: Dependency vulnerability scan
        run: |
          uv export --locked --no-dev --no-emit-project --no-header -o /tmp/xma-production.txt
          uv run pip-audit --strict --requirement /tmp/xma-production.txt
      - name: License inventory
        run: uv run pip-licenses --format=json --output-file=license-inventory.json
      - name: Secret and forbidden tracked-file scan
        run: |
          ! git grep -nEI '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|xox[baprs]-[A-Za-z0-9-]{20,}|(password|token|secret)[[:space:]]*=[[:space:]]*["'"'][^"'"']{8,}["'"'])' -- ':!docs/**' ':!tests/**'
          ! git ls-files | grep -Ei '(\.sqlite3?$|\.db$|cookies?|\.(mp4|webm|mkv|part|tmp)$|release-artifacts/)'
